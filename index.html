<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GitHub Profile Finder</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h2>GitHub Explorer</h2>
    </header>

    <main>
      <!-- SEARCH -->
      <section class="search-section">
        <h1>GitHub Profile Finder</h1>

        <p>
          Search for any public GitHub profile and explore their repositories.
        </p>

        <div class="search-box">
          <input
            type="text"
            id="username-input"
            placeholder="Enter GitHub username"
          />

          <button id="search-btn">Search</button>
        </div>
      </section>

      <!-- PROFILE -->
      <section id="profile-section">
        <div class="profile-card">
          <img id="avatar" src="" alt="Profile Picture" />

          <div class="profile-details">
            <h2 id="profile-name"></h2>

            <p id="profile-username"></p>

            <p id="bio"></p>

            <div class="stats">
              <div>
                <strong id="followers">0</strong>
                <span>Followers</span>
              </div>

              <div>
                <strong id="repo-count">0</strong>
                <span>Repositories</span>
              </div>

              <div>
                <strong id="language">-</strong>
                <span>Main Language</span>
              </div>
            </div>

            <a id="github-link" href="" target="_blank">
              View GitHub Profile →
            </a>
          </div>
        </div>
      </section>

      <!-- REPOSITORIES -->
      <section id="repositories">
        <div class="repo-heading">
          <h2>Repositories</h2>

          <div class="repo-controls">
            <input
              type="text"
              id="repo-search"
              placeholder="Search repositories"
            />

            <select id="sort-repos">
              <option value="default">Sort</option>

              <option value="stars">Most Stars</option>
            </select>
          </div>
        </div>

        <div id="repo-container">
          <!-- Repository cards will be added by JavaScript -->
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
